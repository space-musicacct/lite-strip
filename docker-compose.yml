services:
  lite-strip:
    build: .
    container_name: lite-strip
    restart: on-failure:5
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Tokyo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
