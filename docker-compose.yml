services:
  lite-strip:
    build: .
    container_name: lite-strip
    restart: on-failure:5
    ports:
      - "8080:8080"
    volumes:
      - ./tests:/var/www/lite-strip/tests
    environment:
      - TZ=Asia/Tokyo
      - CHROMIUM_HOST=chromium
      - CHROMIUM_PORT=9222
    depends_on:
      chromium:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  chromium:
    image: zenika/alpine-chrome:latest
    container_name: lite-strip-chromium
    restart: on-failure:5
    # remote-allow-origins is scoped to the exact Origin chrome-php sends (http://127.0.0.1),
    # NOT "*": with "*" a page rendered in the SPA path could open a DevTools WebSocket to
    # :9222 from its own origin and take over the browser (CDP: file:// reads, cross-render
    # access). Locking the allowed Origin rejects that while keeping chrome-php connected.
    command: ["chromium-browser", "--headless", "--no-sandbox", "--disable-gpu", "--remote-debugging-address=0.0.0.0", "--remote-debugging-port=9222", "--remote-allow-origins=http://127.0.0.1"]
    expose:
      - "9222"
    environment:
      - TZ=Asia/Tokyo
